<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Funções do Sistema</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --text-color: #f1f5f9;
            --text-secondary: #64748b;
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .value {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .bar-bg {
            background: var(--border-color);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .status.stopped {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-stop { background: var(--danger); color: white; }
        .btn-start { background: var(--success); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestor de Funções do Sistema</h1>
            <p>Painel de monitorização local e controlo de serviços em tempo real.</p>
        </header>

        <div class="metrics">
            <div class="card">
                <h3>Uso do Processador (CPU)</h3>
                <div class="value" id="cpu-val">0%</div>
                <div class="bar-bg"><div class="bar-fill" id="cpu-bar"></div></div>
            </div>
            <div class="card">
                <h3>Memória RAM</h3>
                <div class="value" id="ram-val">0%</div>
                <div class="bar-bg"><div class="bar-fill" id="ram-bar"></div></div>
            </div>
        </div>

        <div class="panel">
            <h2>Processos e Serviços em Execução</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome da Função</th>
                        <th>Estado</th>
                        <th>CPU</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const processos = [
            { id: 201, nome: "Serviço de Áudio", ativo: true, cpu: 1.2 },
            { id: 202, nome: "Indexador de Ficheiros", ativo: true, cpu: 3.5 },
            { id: 203, nome: "Proteção Antivírus", ativo: true, cpu: 0.8 },
            { id: 204, nome: "Atualizações Agendadas", ativo: false, cpu: 0.0 }
        ];

        function render() {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            processos.forEach(p => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${p.id}</td>
                    <td>${p.nome}</td>
                    <td><span class="status ${p.ativo ? 'active' : 'stopped'}">${p.ativo ? 'Ativo' : 'Parado'}</span></td>
                    <td>${p.ativo ? p.cpu.toFixed(1) + '%' : '0.0%'}</td>
                    <td>
                        <button class="btn ${p.ativo ? 'btn-stop' : 'btn-start'}" onclick="toggle(${p.id})">
                            ${p.ativo ? 'Parar' : 'Iniciar'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggle(id) {
            const p = processos.find(x => x.id === id);
            if (p) {
                p.ativo = !p.ativo;
                p.cpu = p.ativo ? Math.random() * 5 + 1 : 0;
                render();
                updateMetrics();
            }
        }

        function updateMetrics() {
            let totalCpu = processos.reduce((acc, p) => acc + (p.ativo ? p.cpu : 0), 0) + 4.5;
            let totalRam = processos.reduce((acc, p) => acc + (p.ativo ? 8 : 0), 0) + 22;
            
            document.getElementById("cpu-val").innerText = totalCpu.toFixed(1) + "%";
            document.getElementById("ram-val").innerText = totalRam.toFixed(1) + "%";
            document.getElementById("cpu-bar").style.width = totalCpu + "%";
            document.getElementById("ram-bar").style.width = totalRam + "%";
        }

        setInterval(() => {
            processos.forEach(p => {
                if (p.ativo) p.cpu = Math.max(0.5, p.cpu + (Math.random() * 2 - 1));
            });
            render();
            updateMetrics();
        }, 2000);

        render();
        updateMetrics();
    </script>
</body>
</html>
